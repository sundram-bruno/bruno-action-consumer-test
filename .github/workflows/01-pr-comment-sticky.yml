# README recipe: "PR comment on every run (sticky)"
# What you should see: a single PR-conversation comment that updates in place
# on every re-run, plus a check run in the PR Checks tab with structured
# per-test results.

name: 01 — PR comment (sticky)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  bruno:
    name: Run + post sticky PR comment via EnricoMi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: usebruno/bruno-cli-action@v0
        with:
          working-directory: bruno
          command: 'run --env ci --reporter-junit results-sticky.xml'

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: bruno/results-sticky.xml
          check_name: Bruno (sticky comment)
