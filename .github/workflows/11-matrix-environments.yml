# README recipe: "Matrix across environments"
# What you should see: two parallel matrix legs (staging + prod), each
# producing its own artifact and its own check run on the PR Checks tab.
# A PR comment is only posted when a leg fails.

name: 11 — Matrix across environments

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  bruno:
    name: Bruno (matrix.env=${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    steps:
      - uses: actions/checkout@v6

      - uses: usebruno/bruno-cli-action@v0
        with:
          working-directory: bruno
          command: 'run posts.bru users.bru --env ${{ matrix.env }} --reporter-junit results-${{ matrix.env }}.xml'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bruno-report-matrix-${{ matrix.env }}-${{ github.run_id }}
          path: bruno/results-${{ matrix.env }}.xml

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: Bruno matrix (${{ matrix.env }})
          files: bruno/results-${{ matrix.env }}.xml
          comment_mode: failures
