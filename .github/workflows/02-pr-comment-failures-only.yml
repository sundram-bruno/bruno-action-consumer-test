# README recipe: "PR comment only on failures"
# What you should see: PR comment posted only when at least one assertion
# failed. Successful runs leave no comment behind.

name: 02 — PR comment (failures only)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  bruno:
    name: Run + comment only on failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: usebruno/bruno-cli-action@v0
        continue-on-error: true   # workflow check stays green; EnricoMi still posts failure comment
        with:
          working-directory: bruno
          command: 'run --env ci --reporter-junit results-failures-only.xml'

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: bruno/results-failures-only.xml
          check_name: Bruno (failures only)
          comment_mode: failures
