# README recipe: "Soft-fail recipe"
# What you should see: the Bruno step is honest about its status (red on
# assertion failure, green on success) but `continue-on-error: true` lets
# the workflow proceed past failures. Downstream conditional steps can
# read `steps.bruno.outputs.failed` to decide what to do.

name: 12 — Soft-fail

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bruno:
    name: Run + continue past failures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: bruno
        uses: usebruno/bruno-cli-action@v0
        continue-on-error: true
        with:
          working-directory: bruno
          command: 'run --env ci'

      - name: Conditional follow-up on failure
        if: steps.bruno.outputs.failed != '0'
        run: |
          echo "Bruno reported ${{ steps.bruno.outputs.failed }} failed request(s) out of ${{ steps.bruno.outputs.total }}."
          echo "Workflow continues because of continue-on-error: true."

      - name: Conditional follow-up on success
        if: steps.bruno.outputs.failed == '0'
        run: |
          echo "All ${{ steps.bruno.outputs.total }} requests passed in ${{ steps.bruno.outputs.duration-ms }}ms."
