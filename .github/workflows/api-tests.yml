name: 00 — Basic (outputs only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bruno:
    name: Bruno collection via the action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Bruno CLI
        id: bruno
        uses: usebruno/bruno-cli-action@v0
        with:
          working-directory: bruno
          command: 'run posts.bru users.bru --env ci'

      - name: Inspect outputs
        run: |
          set -euo pipefail
          echo "exit-code   = ${{ steps.bruno.outputs.exit-code }}"
          echo "passed      = ${{ steps.bruno.outputs.passed }}"
          echo "failed      = ${{ steps.bruno.outputs.failed }}"
          echo "total       = ${{ steps.bruno.outputs.total }}"
          echo "duration-ms = ${{ steps.bruno.outputs.duration-ms }}"
          test "${{ steps.bruno.outputs.exit-code }}" = "0"
          test "${{ steps.bruno.outputs.failed }}" = "0"
          test "${{ steps.bruno.outputs.total }}" = "2"
