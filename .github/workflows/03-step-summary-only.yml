# README recipe: "Step Summary without PR comment"
# What you should see: a markdown summary on the workflow run page (Actions
# tab → click into the run). No PR Conversation comment.

name: 03 — Step Summary only

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  bruno:
    name: Run + Step Summary, no PR comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: usebruno/bruno-cli-action@v0
        with:
          working-directory: bruno
          command: 'run --env ci --reporter-junit results-step-summary.xml'

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: bruno/results-step-summary.xml
          check_name: Bruno (step summary)
          comment_mode: off
          job_summary: true
